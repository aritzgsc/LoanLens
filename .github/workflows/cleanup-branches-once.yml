name: One-time LoanLens branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-branches-once.yml
permissions:
  contents: write
jobs:
  clean:
    if: github.repository == 'aritzgsc/LoanLens' && github.event.head_commit.message == 'chore: execute reviewed LoanLens branch cleanup'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete only verified obsolete branches
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-branches <<'BRANCHES'
          audit/pixel-polish-all-pages-2026|fcafc375a3cb1bcedd52945109ef773fd446dfb0
          college-aid-comparison|08095c7e868dce4e68aa1d34f6d1ca0c1ab4e768
          design/light-college-planner|cd513fa292f02cfbcbf42d1eb88235201f9f1f78
          design/loanlens-grid-clarity-v5-20261122|992fabd7072f776fe8e472c5c72323e7de0ba3ed
          design/unify-all-page-surfaces|c30c9856d8278a08e869651753b41157843c4860
          diagnostics/pages-connectivity|199d4bfdd4b4dc710b351bedf0e99b899c094eff
          diagnostics/pages-regional|2209cb781b5c9d6d41ec50aeb71b04b16f43b524
          diagnostics/vercel-launch|96c57e951f951de3716e52752838da6342cc42d6
          feat/editorial-layout-and-footer-redesign-2026|85682599140ac79df367a5741047ce6e211af4a2
          feat/intent-first-tools-guides-2026-11-22|4f3215ba5d68f59520f9686227a255bc87800046
          feat/light-homepage-content-seo-2026|e8d7e51a93a9c4ed98ab1675ac0b871c741dc9c1
          feat/loanlens-ux-navigation-reading-2026|26b4717f52474ebf6c754a04653d6cb9dea88ac2
          feat/tools-guides-experience-upgrade-2026|33f9d6648795f9e96aa01472af46f6809f13fe99
          feat/trust-layout-seo-indexing-audit-2026|d7e8112302b42dc517ebcbc80d84bed45115267e
          feat/vercel-web-analytics-traffic|ffd6017749f3cfd62835b115989574180b7f376c
          feat/warm-design-adsense-seo-2026|b53b9349698c412b676652d986cac0f37ca68d91
          fix/audit-v5-financial-ux-and-qa|36d7ffe631afb0ddb8eb2157286ac456f5be36ac
          fix/center-forms-responsive-layout-2026|4b0f5da23293284480aefe3368a9a02e7cee5445
          fix/contrast-calculation-audit-trust-seo|2c7e76b30514fb0cf352fa33968da210562263a7
          fix/restore-layout-align-field-rows-2026|62e7f260d4031a5dead681594dda91ad1b0eea25
          fix/v5-editorial-finance-seo-final|8debcd3f0d0933ef9062af62a39dbe7384912426
          fix/vercel-production-seo-2026|9eb4afd4e2744760978101bfd7308c6a71effcc7
          improve-loanlens-vercel|b9e18dc18b88205c3105067be674d77bebe6ec61
          loanlens-launch-verification|410b90b13ed737565a73fd7cb224d0ae8d7d1c74
          refresh-loanlens-planning-tools|b433c6e603e0e74df297f301bf8779d81ca30b0a
          BRANCHES
          echo 'Checking expected branch heads before deleting any branches'
          while IFS='|' read -r branch sha; do
            if [[ "$branch" == 'main' || -z "$branch" ]]; then echo "Unsafe branch: $branch"; exit 1; fi
            current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
            if [[ "$current" != "$sha" ]]; then
              echo "SAFETY STOP: $branch moved to $current (expected $sha)"
              exit 1
            fi
          done < /tmp/expected-branches
          echo 'All branch heads match. Deleting obsolete branches.'
          while IFS='|' read -r branch sha; do
            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
            echo "Deleted $branch"
          done < /tmp/expected-branches
          echo 'Remaining branches:'
          gh api "repos/$REPO/branches?per_page=100" --jq '.[].name'
